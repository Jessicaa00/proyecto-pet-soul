<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Soul</title>
  <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="mascotas.css">
</head>

<body>

  <!-- header -->
  <header class="navbar-custom fixed-top">
    <div class="logo">
      <img src="../logo/petSoulSVG.svg" alt="Logo Pet Soul">
    </div>

    <!-- Botón hamburguesa -->
    <button class="menu-toggle" onclick="toggleMenu()" aria-label="Menú">
      <i class="bi bi-list"></i>
    </button>

    <nav class="menu d-flex gap-3">
      <a href="../index.html">Inicio</a>
      <a href="../mascotas/mascota.html" class="active">Mascota</a>
      <a href="../foro/foro.html">Foro</a>
      <a href="../institucion/institucion.html">Institución</a>
      <a href="../casos exito/casosexito.html">Casos de Éxito</a>
    </nav>

    <div class="icons d-flex align-items-center gap-3">
      <!-- mensajes -->
      <div class="dropdown">
        <a class="nav-link" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-chat-dots"></i>
        </a>
        <ul class="dropdown-menu dropdown-menu-end p-2" style="min-width: 250px;">
          <li><strong class="dropdown-header">Mensajes</strong></li>
          <li><a class="dropdown-item" href="#"></a></li>
          <li><a class="dropdown-item" href="#"></a></li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <li><a class="dropdown-item text-center" href="../mensajes/mensajes.html">Ver todos</a></li>
        </ul>
      </div>

      <!-- notificaciones -->
      <div class="dropdown">
        <a class="nav-link" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-bell position-relative"></i>
        </a>
        <ul class="dropdown-menu dropdown-menu-end p-2" style="min-width: 250px;">
          <li><strong class="dropdown-header">Notificaciones</strong></li>
          <li><a class="dropdown-item" href="#"></a></li>
          <li><a class="dropdown-item" href="#"></a></li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <li><a class="dropdown-item text-center" href="#">Ver todas</a></li>
        </ul>
      </div>

      <!-- usuario -->
      <div class="dropdown">
        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-person-circle"></i>
        </a>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="../login/login.html">Login</a></li>
          <li><a class="dropdown-item" href="../registrarse/registrarse.html">Registrarse</a></li>
        </ul>
      </div>
    </div>
  </header>


  <!-- hero -->
  <section class="hero">
    <div class="overlay"></div>
    <h2>Mascotas en adopción</h2>
  </section>

  <!-- filtros -->
  <section class="container my-4">
    <form class="row g-3 align-items-end" id="formFiltros">
      <div class="col-md-3">
        <label for="especie" class="form-label">Especie</label>
        <select id="especie" class="form-select">
          <option value="">Todas</option>
          <option value="perro">Perro</option>
          <option value="gato">Gato</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="tamaño" class="form-label">Tamaño</label>
        <select id="tamaño" class="form-select">
          <option value="">Todos</option>
          <option value="pequeno">Pequeño</option>
          <option value="medio">Medio</option>
          <option value="grande">Grande</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="edad" class="form-label">Edad</label>
        <select id="edad" class="form-select">
          <option value="">Todas</option>
          <option value="cachorro">Cachorro</option>
          <option value="adulto">Adulto</option>
          <option value="senior">Señor</option>
        </select>
      </div>
      <div class="col-md-3">
        <button type="submit" class="btn btn-dark w-100">Filtrar</button>
      </div>
    </form>
  </section>

  <!-- TARJETAS -->
  <section class="container my-5">
    <div class="row justify-content-center" id="contenedorMascotas">
      <!-- Las tarjetas se generan aquí dinámicamente desde MySQL -->
    </div>
    <div class="text-center my-4">
      <button class="btn-ver-mas">Ver más</button>
    </div>
  </section>

  <!-- footer -->
  <footer class="footer">
    <div class="footer-container">
      <div class="footer-logo">
        <img src="../logo/petSoulSVG.svg" alt="Logo Pet Soul">
      </div>
      <nav class="footer-menu">
        <a href="../index.html">Inicio</a>
        <a href="../mascotas/mascotas.html">Mascotas</a>
        <a href="../casos exito/casosexito.html">Casos de Éxito</a>
        <a href="../foro/foro.html">Foro</a>
        <a href="../institucion/institucion.html">Institución</a>
      </nav>
      <div class="footer-social">
        <a href="#"><i class="bi bi-facebook"></i></a>
        <a href="#"><i class="bi bi-instagram"></i></a>
        <a href="#"><i class="bi bi-envelope"></i></a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="mascotas.js"></script>
  <script src="../auth/auth.js"></script>

</body>

</html>
